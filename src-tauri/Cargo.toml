[package]
name = "asteria-shell"
version = "0.1.0"
description = "Asteria Browser Outer Application Shell"
authors = ["Asteria Team"]
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
asteria = { path = ".." }
