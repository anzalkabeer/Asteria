[package]
name = "asteria"
version = "0.1.0"
edition = "2024"

[lib]
name = "asteria"
path = "src/lib.rs"

[[bin]]
name = "asteria"
path = "src/main.rs"

[dependencies]
wgpu = "22.1"
winit = "0.29"
pollster = "0.3"
bytemuck = { version = "1.16", features = ["derive"] }
glyphon = "0.6"
log = "0.4"
env_logger = "0.11"
